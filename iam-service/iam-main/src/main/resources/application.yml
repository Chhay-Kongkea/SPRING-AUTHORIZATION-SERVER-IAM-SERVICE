server:
  port: ${SERVER_PORT:9000}
  forward-headers-strategy: framework

iam:
  issuer: ${IAM_ISSUER:http://localhost:9000}
  keys:
    public-key-b64: ${IAM_JWK_PUBLIC_KEY_B64:}
    private-key-b64: ${IAM_JWK_PRIVATE_KEY_B64:}
    allow-ephemeral: ${IAM_ALLOW_EPHEMERAL_JWK:true}
  dcr:
    initial-client-id: ${IAM_DCR_CLIENT_ID:iam-dcr-bootstrap}
    initial-client-secret: ${IAM_DCR_CLIENT_SECRET:change-this-bootstrap-secret}
  web-client-secret: ${IAM_WEB_CLIENT_SECRET:change-this-web-client-secret}
  social:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  bootstrap-admin:
    username: ${IAM_ADMIN_USERNAME:}
    email: ${IAM_ADMIN_EMAIL:}
    password: ${IAM_ADMIN_PASSWORD:}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9544/iam_db}
    username: ${DB_USERNAME:iteuser}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

gg:
  jte:
    templateLocation: ../iam-web/src/main/jte
    templateSuffix: .jte
    developmentMode: ${JTE_DEV_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
