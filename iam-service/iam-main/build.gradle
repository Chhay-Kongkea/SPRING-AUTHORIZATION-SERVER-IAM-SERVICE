plugins {
    id 'spring-boot-common-conventions'
    id 'gg.jte.gradle' version '3.2.5'
}

jte {
    sourceDirectory = file('../iam-web/src/main/jte').toPath()
    contentType = gg.jte.ContentType.Html
    generate()
}

dependencies {



    implementation 'kh.edu.istad:iam-domain-core'
    implementation 'kh.edu.istad:iam-application-service'
    implementation 'kh.edu.istad:iam-persistence'
    implementation 'kh.edu.istad:iam-infrastructure'
    implementation 'kh.edu.istad:iam-rest-api'
    implementation 'kh.edu.istad:iam-web'

    implementation "kh.edu.istad:istad-common-swagger"

    implementation 'io.swagger.core.v3:swagger-annotations:3.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.postgresql:postgresql'
    implementation 'gg.jte:jte:3.2.5'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.5'
//    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}



tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'iam.integration', System.getProperty('iam.integration', 'false')
}
